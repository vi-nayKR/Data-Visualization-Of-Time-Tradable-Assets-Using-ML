# Nginx Rate Limiting & Reverse Proxy Configuration
# Production Ops for Data Visualization of Time-Tradable Assets Using ML

limit_req_zone $binary_remote_addr zone=stock_api_limit:10m rate=20r/s;
limit_req_status 429;

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name stock-api.internal localhost;

    # Maximum client body size
    client_max_body_size 2M;

    # Gzip Compression for High-Throughput JSON & Charts
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Proxy with Rate Limiting
    location /api/ {
        limit_req zone=stock_api_limit burst=30 nodelay;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Response Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }

    # Health Check (Unthrottled for Liveness Probes)
    location = /api/health {
        proxy_pass http://fastapi_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
