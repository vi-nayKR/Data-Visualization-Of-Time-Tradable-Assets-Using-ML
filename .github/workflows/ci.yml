name: CI Build & Quality Gate

on:
  push:
    branches: [ main, feat/india-honest-forecasting ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    name: Build Frontend (Angular 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular Application
        working-directory: frontend
        run: npm run build

      - name: Ticker snapshot path mapping
        run: node scripts/check_ticker_paths.cjs

  build-backend:
    name: Test Backend (FastAPI & PyTorch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Check code syntax
        working-directory: backend
        run: python -m compileall app/

      - name: Reject shadowed backend imports
        run: python scripts/check_backend_shadowing.py

      - name: Leakage, metrics, sanity and determinism tests
        working-directory: backend
        run: python -m pytest tests -q
